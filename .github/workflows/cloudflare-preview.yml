name: LT CMS Cloudflare Preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cloudflare-preview.yml'
      - '.cloudflare-run-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lt-cms-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout LT-CMS private source ephemerally
        uses: actions/checkout@v4
        with:
          repository: valuesplayshg/LT-CMS
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend into Spring static resources
        working-directory: source/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: source/backend/pom.xml

      - name: Build backend
        working-directory: source/backend
        run: mvn -B -Dmaven.test.skip=true clean package

      - name: Start LT-CMS
        shell: bash
        env:
          SESSION_COOKIE_SECURE: "false"
        run: |
          set -euo pipefail
          JAR=$(find source/backend/target -maxdepth 1 -name 'lt-cms-*.jar' ! -name '*.original' | head -1)
          test -n "$JAR"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..90}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/system/info || true)
            if [[ "$code" = "200" ]]; then
              echo "LT-CMS started"
              exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          WORKING_URL=""
          for attempt in 1 2 3; do
            rm -f cloudflared.log cloudflared.pid
            nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8087 > cloudflared.log 2>&1 &
            echo $! > cloudflared.pid

            URL=""
            for i in {1..60}; do
              URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
              [[ -n "$URL" ]] && break
              if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then break; fi
              sleep 2
            done

            if [[ -n "$URL" ]]; then
              for i in {1..45}; do
                code=$(curl -k -sS -L -o /dev/null -w '%{http_code}' "$URL" || true)
                if [[ "$code" =~ ^(200|301|302|401|403)$ ]]; then
                  WORKING_URL="$URL"
                  break
                fi
                sleep 2
              done
            fi

            [[ -n "$WORKING_URL" ]] && break
            kill "$(cat cloudflared.pid)" 2>/dev/null || true
            sleep 5
          done

          test -n "$WORKING_URL"
          printf '%s\n' "$WORKING_URL" | tee cloudflare-url.txt
          echo "CLOUDFLARE_URL=$WORKING_URL" >> "$GITHUB_ENV"

      - name: Publish only preview URL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$CLOUDFLARE_URL" > .cloudflare-preview-url
          git add .cloudflare-preview-url
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish LT-CMS Cloudflare preview URL [skip ci]"
            git push origin HEAD:main
          fi

      - name: Keep preview alive
        shell: bash
        run: |
          echo "Cloudflare preview: $CLOUDFLARE_URL"
          sleep 20400
