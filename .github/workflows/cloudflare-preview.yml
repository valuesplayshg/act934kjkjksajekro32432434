name: LT CMS Cloudflare Preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cloudflare-preview.yml'
      - '.cloudflare-run-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lt-cms-external-preview-v3
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout LT-CMS private source ephemerally
        uses: actions/checkout@v4
        with:
          repository: valuesplayshg/LT-CMS
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend into Spring static resources
        working-directory: source/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: source/backend/pom.xml

      - name: Build backend
        working-directory: source/backend
        run: mvn -B -Dmaven.test.skip=true clean package

      - name: Start LT-CMS
        shell: bash
        env:
          SESSION_COOKIE_SECURE: "false"
        run: |
          set -euo pipefail
          JAR=$(find source/backend/target -maxdepth 1 -name 'lt-cms-*.jar' ! -name '*.original' | head -1)
          test -n "$JAR"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..90}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/system/info || true)
            if [[ "$code" = "200" ]]; then
              echo "LT-CMS started"
              exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Start Vite frontend and verify backend proxy
        working-directory: source/frontend
        shell: bash
        env:
          __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ".trycloudflare.com"
        run: |
          set -euo pipefail
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > ../../vite.log 2>&1 &
          echo $! > ../../vite.pid
          for i in {1..90}; do
            ui_code=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/ || true)
            api_code=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/system/info || true)
            if [[ "$ui_code" = "200" && "$api_code" = "200" ]]; then
              echo "Vite frontend ready on :5173; backend proxy healthy"
              exit 0
            fi
            if ! kill -0 "$(cat ../../vite.pid)" 2>/dev/null; then
              cat ../../vite.log
              exit 1
            fi
            sleep 2
          done
          cat ../../vite.log
          exit 1

      - name: Start Pinggy HTTPS Tunnel
        shell: bash
        run: |
          set -euo pipefail
          rm -f pinggy.log pinggy.pid

          nohup ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -p 443 \
            -R0:127.0.0.1:5173 \
            free.pinggy.io > pinggy.log 2>&1 &
          echo $! > pinggy.pid

          WORKING_URL=""
          for i in {1..60}; do
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.(pinggy\.link|pinggy-free\.link)' pinggy.log | head -1 || true)
            if [[ -n "$URL" ]]; then
              for j in {1..30}; do
                code=$(curl -k -sS -L --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$URL" || true)
                if [[ "$code" = "200" ]]; then
                  WORKING_URL="$URL"
                  break
                fi
                sleep 2
              done
            fi
            [[ -n "$WORKING_URL" ]] && break
            if ! kill -0 "$(cat pinggy.pid)" 2>/dev/null; then
              cat pinggy.log || true
              break
            fi
            sleep 2
          done

          if [[ -z "$WORKING_URL" ]]; then
            echo "Unable to obtain a healthy Pinggy HTTPS URL."
            cat pinggy.log || true
            exit 1
          fi

          printf '%s\n' "$WORKING_URL" | tee cloudflare-url.txt
          echo "CLOUDFLARE_URL=$WORKING_URL" >> "$GITHUB_ENV"
          echo "Preview URL: $WORKING_URL"

      - name: Publish only preview URL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$CLOUDFLARE_URL" > .cloudflare-preview-url
          git add .cloudflare-preview-url
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish LT-CMS Cloudflare preview URL [skip ci]"
            git push origin HEAD:main
          fi

      - name: Keep preview alive
        shell: bash
        run: |
          echo "External preview: $CLOUDFLARE_URL"
          sleep 20400
