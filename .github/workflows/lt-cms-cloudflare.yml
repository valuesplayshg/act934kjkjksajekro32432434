name: LT-CMS Private Source -> Live HMR Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lt-cms-private-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOURCE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.token }}

    steps:
      - name: Validate private source credential
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Missing repository secret PRIVATE_REPO_TOKEN (or token)."
            exit 1
          fi

      - name: Checkout private LT-CMS into ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: valuesplayshg/LT-CMS
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          path: _src
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        shell: bash
        working-directory: _src/frontend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/tmp/ltcms-npm.log 2>&1
          echo "Frontend dependencies installed."

      - name: Verify frontend TypeScript and production build
        shell: bash
        working-directory: _src/frontend
        run: |
          set -euo pipefail
          if ! npm run build >/tmp/ltcms-frontend-build.log 2>&1; then
            cat /tmp/ltcms-frontend-build.log
            exit 1
          fi
          echo "Frontend TypeScript/Vite build completed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend privately
        shell: bash
        working-directory: _src/backend
        run: |
          set -euo pipefail
          mvn -q -B -Dmaven.test.skip=true clean package >/tmp/ltcms-maven.log 2>&1
          echo "Backend build completed."

      - name: Start LT-CMS backend
        shell: bash
        env:
          SESSION_COOKIE_SECURE: "false"
        run: |
          set -euo pipefail
          JAR=$(find _src/backend/target -maxdepth 1 -name 'lt-cms-*.jar' ! -name '*.original' | head -1)
          test -n "$JAR"
          nohup java -jar "$JAR" >/tmp/ltcms-app.log 2>&1 &
          echo $! >/tmp/ltcms-app.pid

          for i in {1..90}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/system/info || true)
            if [ "$code" = "200" ]; then
              echo "LT-CMS backend started."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ltcms-app.pid)" 2>/dev/null; then
              echo "::error::LT-CMS backend stopped during startup."
              cat /tmp/ltcms-app.log || true
              exit 1
            fi
            sleep 2
          done

          echo "::error::LT-CMS backend startup timed out."
          cat /tmp/ltcms-app.log || true
          exit 1

      - name: Start Vite live frontend with HMR
        shell: bash
        working-directory: _src/frontend
        run: |
          set -euo pipefail
          nohup npx vite --host 0.0.0.0 --port 5173 >/tmp/ltcms-vite.log 2>&1 &
          echo $! >/tmp/ltcms-vite.pid

          for i in {1..60}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/ || true)
            if [ "$code" = "200" ]; then
              echo "Vite HMR frontend started."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ltcms-vite.pid)" 2>/dev/null; then
              echo "::error::Vite frontend stopped during startup."
              cat /tmp/ltcms-vite.log || true
              exit 1
            fi
            sleep 2
          done

          echo "::error::Vite frontend startup timed out."
          cat /tmp/ltcms-vite.log || true
          exit 1

      - name: Verify login through Vite proxy
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(sed -n "s/.*--data-urlencode 'password=\([^']*\)'.*/\1/p" _src/.github/workflows/ci-main.yml | head -1)
          test -n "$PASS"
          rm -f /tmp/ltcms-auth-cookies.txt
          CSRF_JSON=$(curl -fsS -c /tmp/ltcms-auth-cookies.txt http://127.0.0.1:5173/api/auth/csrf)
          CSRF=$(printf '%s' "$CSRF_JSON" | python -c "import json,sys; print(json.load(sys.stdin)['token'])")
          HEADER=$(printf '%s' "$CSRF_JSON" | python -c "import json,sys; print(json.load(sys.stdin)['headerName'])")
          curl -fsS -L -b /tmp/ltcms-auth-cookies.txt -c /tmp/ltcms-auth-cookies.txt \
            -H "$HEADER: $CSRF" -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=SITE001:admin' --data-urlencode "password=$PASS" \
            http://127.0.0.1:5173/api/auth/process >/tmp/ltcms-login.json
          SESSION=$(curl -fsS -b /tmp/ltcms-auth-cookies.txt http://127.0.0.1:5173/api/auth/session)
          printf '%s' "$SESSION" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('siteCode')=='SITE001' and d.get('username')=='admin'"
          echo "Vite proxy login verified."

      - name: Browser verify menu permission storyboard and CRUD
        working-directory: _src/e2e
        env:
          LTCMS_BASE_URL: http://127.0.0.1:5173
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/tmp/ltcms-playwright-install.log 2>&1
          npx playwright install --with-deps chromium >/tmp/ltcms-playwright-browser.log 2>&1
          npx playwright test ltcms.spec.ts -g '메뉴권한 스토리보드 3열 및 CRUD 저장·재조회 검증|공통코드와 단계형 코드 스토리보드 CRUD 검증|부서관리 스토리보드 트리 목록 CRUD 저장' --reporter=line

      - name: Capture all storyboard menu screens
        working-directory: _src/e2e
        env:
          LTCMS_BASE_URL: http://127.0.0.1:5173
          LTCMS_AUDIT_DIR: storyboard-audit
        shell: bash
        run: |
          npx playwright test storyboard-audit.spec.ts -g '전체 메뉴 화면 캡처 - 오류 화면도 누락 없이 수집' --reporter=line

      # Only rendered UI screenshots and the index are exported; never source files.
      - name: Upload screenshot evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lt-cms-storyboard-screens-${{ github.run_id }}
          path: |
            _src/e2e/storyboard-audit/full-menu/
            _src/e2e/storyboard-audit/full-menu-index.json
          if-no-files-found: warn
          retention-days: 1

      - name: Start live frontend source sync
        shell: bash
        run: |
          set -euo pipefail
          git -C _src rev-parse HEAD > /tmp/ltcms-last-source-sha

          nohup bash -c '
            set +e
            while true; do
              git -C _src fetch -q origin main
              if [ $? -eq 0 ]; then
                REMOTE_SHA=$(git -C _src rev-parse origin/main 2>/dev/null)
                LAST_SHA=$(cat /tmp/ltcms-last-source-sha 2>/dev/null)

                if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$LAST_SHA" ]; then
                  BEFORE_PKG=$(sha256sum _src/frontend/package.json _src/frontend/package-lock.json 2>/dev/null | sha256sum | cut -d" " -f1)

                  git -C _src reset --hard "$REMOTE_SHA" >/dev/null 2>&1
                  echo "$REMOTE_SHA" > /tmp/ltcms-last-source-sha

                  AFTER_PKG=$(sha256sum _src/frontend/package.json _src/frontend/package-lock.json 2>/dev/null | sha256sum | cut -d" " -f1)

                  if [ "$BEFORE_PKG" != "$AFTER_PKG" ]; then
                    (cd _src/frontend && npm install --no-audit --no-fund >/tmp/ltcms-npm-sync.log 2>&1)
                  fi

                  echo "Frontend source updated to $REMOTE_SHA"
                fi
              fi
              sleep 5
            done
          ' >/tmp/ltcms-sync.log 2>&1 &
          echo $! >/tmp/ltcms-sync.pid
          echo "Live frontend source sync started."

      - name: Start Cloudflare Quick Tunnel to Vite
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -sS -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          URL=""
          for attempt in 1 2 3; do
            rm -f /tmp/cloudflared.log /tmp/cloudflared.pid
            nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:5173 >/tmp/cloudflared.log 2>&1 &
            echo $! >/tmp/cloudflared.pid

            CANDIDATE=""
            for i in {1..60}; do
              # The API endpoint may appear in error logs; it is NOT a tunnel URL.
              CANDIDATE=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | grep -vE '^https://(api|www)\.trycloudflare\.com$' | head -1 || true)
              [ -n "$CANDIDATE" ] && break
              if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then break; fi
              sleep 2
            done

            if [ -n "$CANDIDATE" ]; then
              for i in {1..12}; do
                if curl -fsS -L --connect-timeout 5 --max-time 15 "$CANDIDATE/api/system/info" 2>/dev/null | python -c 'import json,sys; assert isinstance(json.load(sys.stdin), dict)' 2>/dev/null; then
                  URL="$CANDIDATE"
                  break
                fi
                sleep 2
              done
            fi

            [ -n "$URL" ] && break
            echo "::warning::Tunnel attempt $attempt did not yield a healthy public LT-CMS endpoint."
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
            sleep 3
          done

          if [ -z "$URL" ]; then
            echo "::error::No externally verified Cloudflare Quick Tunnel URL."
            tail -30 /tmp/cloudflared.log || true
            exit 1
          fi

          HOST=${URL#https://}
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "$URL" > /tmp/lt-cms-cloudflare-url.txt
          echo "CLOUDFLARE_URL=$URL" >> "$GITHUB_ENV"
          {
            echo "### LT-CMS Live HMR Preview"
            echo ""
            echo "$URL"
            echo ""
            echo "Frontend main branch changes are synchronized every 5 seconds and served through Vite HMR."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LT-CMS LIVE HMR URL: $URL"

      - name: Publish URL marker only
        uses: actions/upload-artifact@v4
        with:
          name: lt-cms-url-${{ steps.tunnel.outputs.host }}
          path: /tmp/lt-cms-cloudflare-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish preview URL as commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["CLOUDFLARE_URL"]
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          payload = json.dumps({
              "state": "success",
              "target_url": url,
              "description": "LT-CMS live HMR preview is active",
              "context": "lt-cms/cloudflare-preview"
          }).encode()
          req = urllib.request.Request(
              api,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req) as r:
              print(r.read().decode())
          PY

      - name: Keep live preview active
        shell: bash
        run: |
          echo "Live HMR preview: $CLOUDFLARE_URL"
          sleep 20400

      - name: Secure cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ltcms-sync.pid ]; then kill "$(cat /tmp/ltcms-sync.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/cloudflared.pid ]; then kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/ltcms-vite.pid ]; then kill "$(cat /tmp/ltcms-vite.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/ltcms-app.pid ]; then kill "$(cat /tmp/ltcms-app.pid)" 2>/dev/null || true; fi
          rm -rf "$GITHUB_WORKSPACE/_src"
          rm -f /tmp/ltcms-*.log /tmp/ltcms-*.pid /tmp/ltcms-last-source-sha /tmp/lt-cms-cloudflare-url.txt
          rm -f /tmp/cloudflared /tmp/cloudflared.log /tmp/cloudflared.pid
          echo "Ephemeral private source and runtime files removed."
