name: LT-CMS Private Main CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/lt-cms-private-ci.yml'
      - '.lt-cms-ci-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lt-cms-private-main-ci
  cancel-in-progress: true

jobs:
  verify-private-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.token }}
      CMS_DATABASE_MODE: memory
      CMS_SAMPLE_INIT: "true"
      CMS_DATA_INIT: "true"
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Validate private source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::PRIVATE_REPO_TOKEN (or token) is required."; exit 1; }

      - name: Checkout private LT-CMS main ephemerally
        uses: actions/checkout@v4
        with:
          repository: valuesplayshg/LT-CMS
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          path: _src
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Record private source SHA
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git -C _src rev-parse HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Private LT-CMS source commit: $SOURCE_SHA"

      - name: Verify eGovFrame 5.0 source structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<artifactId>egovframe-boot-starter-parent</artifactId>' _src/backend/pom.xml
          grep -q '<version>5.0.0</version>' _src/backend/pom.xml
          grep -R -q 'extends EgovAbstractServiceImpl' _src/backend/src/main/java/com/ltcms
          grep -R -q 'extends EgovAbstractMapper' _src/backend/src/main/java/com/ltcms
          grep -R -q 'EgovUserDetailsHelper' _src/backend/src/main/java/com/ltcms
          grep -R -q 'EgovExcelService' _src/backend/src/main/java/com/ltcms
          grep -q '@Import(EgovSecurityConfiguration.class)' _src/backend/src/main/java/com/ltcms/EgovRuntimeConfig.java
          test -f _src/docs/COMPATIBILITY_GUIDE_PRECHECK_20260930.md
          test -f _src/docs/EGOVFRAME_5_COMPLIANCE_POLICY.md
          test -f _src/docs/REVIEW_SOURCE_INDEX.md
          grep -R -q '공식 등급 미확정' _src/backend/src/main/java/com/ltcms/compatibility
          if grep -R -q '호환 레벨2' _src/backend/src/main/java _src/backend/src/test _src/docs/COMPATIBILITY_PRECHECK_20260930.md; then
            echo '::error::Formal compatibility level must remain unconfirmed before official review.'
            exit 1
          fi
          if grep -R -E -q 'class[[:space:]]+[A-Za-z0-9_]*Controller[[:space:]]+extends[[:space:]]+EgovAbstractServiceImpl' _src/backend/src/main/java/com/ltcms; then
            echo '::error::Controller must not extend EgovAbstractServiceImpl directly.'
            exit 1
          fi
          if find _src/backend/src/main/java/com/ltcms -name '*Controller.java' -print0 | xargs -0 grep -l '@Transactional' | grep -q .; then
            echo '::error::Controller must not own transaction boundaries; move business logic to Service.'
            exit 1
          fi
          if grep -R -E -q '^import .*\.mapper\.' _src/backend/src/main/java/com/ltcms --include='*Controller.java'; then
            echo '::error::Controller must not import Mapper/DAO types directly.'
            exit 1
          fi
          if grep -R -E -q '(DataSource|JdbcTemplate|EntityManager)' _src/backend/src/main/java/com/ltcms --include='*Controller.java'; then
            echo '::error::Controller must not access persistence infrastructure directly.'
            exit 1
          fi
          while IFS= read -r file; do
            if grep -q '@Repository' "$file" && grep -E -q '(DataSource|JdbcTemplate|java\.sql\.Connection|getConnection\()' "$file"; then
              echo "::error::Repository/Mapper must use eGov DataAccess rather than direct JDBC: $file"
              exit 1
            fi
          done < <(find _src/backend/src/main/java/com/ltcms -name '*.java')
          while IFS= read -r file; do
            if grep -q '@Service' "$file"; then
              grep -q 'extends EgovAbstractServiceImpl' "$file" || { echo "::error::Service must extend EgovAbstractServiceImpl: $file"; exit 1; }
              grep -E -q 'implements[[:space:]]+[A-Za-z0-9_<> ,]*Service' "$file" || { echo "::error::Service must implement a Service interface: $file"; exit 1; }
            fi
          done < <(find _src/backend/src/main/java/com/ltcms -name '*.java')
          if grep -R -E -q '^package[[:space:]]+org\.egovframe\.rte' _src/backend/src/main/java; then
            echo '::error::Application extensions must not declare org.egovframe.rte packages.'
            exit 1
          fi
          while IFS= read -r file; do
            base=$(basename "$file")
            if [[ "$base" == Egov*.java ]] && grep -q 'extends EgovAbstractServiceImpl' "$file"; then
              echo "::error::Application Service extending eGov base must not use Egov* class name: $file"
              exit 1
            fi
          done < <(find _src/backend/src/main/java/com/ltcms -name '*.java')
          test -f _src/backend/src/main/java/com/ltcms/ltcms/chat/SitePublicChatServiceImpl.java
          test -f _src/backend/src/main/java/com/ltcms/basic/service/SiteScopeBootstrapServiceImpl.java
          test -f _src/backend/src/main/java/com/ltcms/basic/service/SiteProvisionServiceImpl.java
          test -f _src/backend/src/main/java/com/ltcms/ltcms/database/DatabaseMetadataInspector.java
          test ! -f _src/backend/src/main/java/com/ltcms/ltcms/database/DatabaseMetadataMapper.java

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend TypeScript and Vite build
        working-directory: _src/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: _src/backend/pom.xml

      - name: Backend full tests and package
        working-directory: _src/backend
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean test package

      - name: Start packaged LT-CMS
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find _src/backend/target -maxdepth 1 -name 'lt-cms-*.jar' ! -name '*.original' | head -1)
          test -n "$JAR"
          nohup java -jar "$JAR" >/tmp/ltcms-ci-app.log 2>&1 &
          echo $! >/tmp/ltcms-ci-app.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8087/api/system/info >/tmp/ltcms-system.json; then
              cat /tmp/ltcms-system.json
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ltcms-ci-app.pid)" 2>/dev/null; then
              cat /tmp/ltcms-ci-app.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/ltcms-ci-app.log
          exit 1

      - name: Write private source verification summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### LT-CMS Private Main Verification"
            echo ""
            echo "- Private source commit: ${SOURCE_SHA:-unknown}"
            echo "- Verification result: $JOB_STATUS"
            echo "- Execution: ephemeral public GitHub-hosted runner"
            echo "- Private source is removed during cleanup and is not committed to this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secure cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ltcms-ci-app.pid ]; then kill "$(cat /tmp/ltcms-ci-app.pid)" 2>/dev/null || true; fi
          rm -rf "$GITHUB_WORKSPACE/_src"
          rm -f /tmp/ltcms-ci-app.log /tmp/ltcms-ci-app.pid /tmp/ltcms-system.json /tmp/status-response.json
          echo "Private source removed from ephemeral runner; nothing is committed or uploaded."
