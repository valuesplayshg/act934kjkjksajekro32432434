name: LT CMS Admin Preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/admin-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lt-cms-admin-preview-stable
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Checkout LT-CMS private source ephemerally
        uses: actions/checkout@v4
        with:
          repository: valuesplayshg/LT-CMS
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm install --no-audit --no-fund

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: source/backend/pom.xml

      - name: Build backend
        working-directory: source/backend
        run: mvn -q -B -Dmaven.test.skip=true clean package

      - name: Start backend with H2 file DB
        shell: bash
        env:
          SESSION_COOKIE_SECURE: "false"
        run: |
          set -euo pipefail
          JAR=$(find source/backend/target -maxdepth 1 -name 'lt-cms-*.jar' ! -name '*.original' | head -1)
          test -n "$JAR"
          mkdir -p "$GITHUB_WORKSPACE/data"
          nohup env CMS_DATABASE_MODE=file CMS_FILE_DB_PATH="$GITHUB_WORKSPACE/data/ltcms" java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..90}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/system/info || true)
            if [[ "$code" = "200" ]]; then
              echo "Backend ready"
              exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Start Vite frontend
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 0.0.0.0 --port 5173 > ../../vite.log 2>&1 &
          echo $! > ../../vite.pid
          for i in {1..60}; do
            ui=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/ || true)
            api=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/system/info || true)
            if [[ "$ui" = "200" && "$api" = "200" ]]; then
              echo "Vite + API proxy ready"
              exit 0
            fi
            sleep 2
          done
          cat ../../vite.log
          exit 1

      - name: Start localhost.run HTTPS tunnel
        shell: bash
        run: |
          set -euo pipefail
          rm -f lhr.log lhr.pid
          nohup ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -R 80:127.0.0.1:5173 \
            nokey@localhost.run > lhr.log 2>&1 &
          echo $! > lhr.pid

          URL=""
          for i in {1..60}; do
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.lhr\.life' lhr.log | head -1 || true)
            [[ -n "$URL" ]] && break
            if ! kill -0 "$(cat lhr.pid)" 2>/dev/null; then
              cat lhr.log || true
              exit 1
            fi
            sleep 2
          done
          test -n "$URL"

          for i in {1..30}; do
            code=$(curl -k -sS -L --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$URL" || true)
            if [[ "$code" = "200" ]]; then
              echo "ADMIN_URL=$URL" >> "$GITHUB_ENV"
              printf '%s\n' "$URL" > admin-preview-url.txt
              echo "Admin URL: $URL"
              exit 0
            fi
            sleep 2
          done
          cat lhr.log || true
          exit 1

      - name: Publish admin URL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$ADMIN_URL" > .admin-preview-url
          git add .admin-preview-url
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish LT-CMS admin preview URL [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Keep admin preview alive
        run: |
          echo "LT-CMS admin preview: $ADMIN_URL"
          sleep 19800
